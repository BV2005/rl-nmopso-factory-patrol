# vS: the sensor-input policy of the x500_patrol drone (rlpatrol/sensors.py).
# vB's training settings (results/runs/vB_seed1.log config_json), except the observation:
#   the actor sees only the fused lidar + depth-camera scan (sensor_obs) - no oracle rays, no
#   whole-map route features, no threat-to-go of the known cylinders;
#   the critic additionally sees those oracle features (priv_critic: asymmetric actor-critic), which
#   exist in simulation only and are dropped at deployment;
#   sensor noise, bin dropout and pose error are simulated (sensor_noise: domain randomisation).
#   python scripts/train.py --name vS_seed1 --config configs/vS.yaml --seed 1
iters: 2000
batch: 8192
minibatch: 8192
act_pen: 0.02
budget: true
budget_pen: 50.0
dense: true
budget_obs: false
route_obs: false
sensor_obs: true
priv_critic: true
sensor_noise: true
device: cuda
snapshot_every: 200
