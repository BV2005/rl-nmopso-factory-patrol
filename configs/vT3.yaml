# vT3 (= vT2 env and reward + training-stability fixes): the time-minimising, encoding-free leg planner (docs/time_optimal_rl.md).
# Step-wise waypoints (0.4-1.5 m) until the goal, turn bound 45 deg per step and 45 deg per 0.5 m,
# box collision model (obstacles + 0.5 m) with the margin-aware scan, objectives flight time / threat /
# altitude-energy (preference-conditioned), climb and backtrack modes, clean legs.
#   python scripts/train_t.py --name vT3_seed1 --config configs/vT3.yaml --seed 1
iters: 800
batch: 8192
minibatch: 16384
levels_per_iter: 64
p_extra: 0.3
act_pen: 0.02
c_prox: 0.5
d_safe: 0.5
box_margin: 0.5
# reward (rlpatrol/env_t.py docstring): dense time cost, linear success term, failure pays the full time cap
c_time: 6.0
t_cap: 3.0
succ: 2.0
fail: 6.0
c_q: 1.0
q_max: 4.0
noise_decay: true
log_std0: -1.0
log_std_end: -1.9
plr: false
dr: 0
device: cuda
snapshot_every: 500
# vT3 training stability (rlpatrol/ppo_t.py docstring): lr decay, per-minibatch KL stop, std / entropy floors,
# validation-selected best checkpoint (<name>_best.pt; report that one)
lr_end: 3.0e-5
kl_stop: 1.5
log_std_min: -1.9
ent_min: 0.001
val_every: 20
val_worlds: 32
val_legs: 8
val_time_w: 0.25
