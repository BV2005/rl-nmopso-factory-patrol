# vG phase 4 (docs/generalizable_rl.md): P1 advance only, uniform levels; P2 + climb/backtrack;
# P3 + Prioritized Level Replay; P4 + full domain randomisation.
#   python scripts/train_g.py --name vG_p4_seed1 --config configs/vG_p4.yaml --seed 1
iters: 3000
batch: 8192
minibatch: 8192
budget: true
budget_pen: 50.0
act_pen: 0.02
levels_per_iter: 64
p_extra: 0.3
device: cuda
snapshot_every: 500
modes: all
plr: true
dr: 1
